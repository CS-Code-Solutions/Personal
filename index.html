    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsoyXz4x2BGXHmm-iPb56fn6K07AXOgSY",
            authDomain: "diegopersonal-9be2f.firebaseapp.com",
            projectId: "diegopersonal-9be2f",
            storageBucket: "diegopersonal-9be2f.firebasestorage.app",
            messagingSenderId: "263464241505",
            appId: "1:263464241505:web:a8eabb265936626f905d20"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", async function() {
            try {
                // 1. Carregar Carrossel e Títulos
                const carouselDoc = await getDoc(doc(db, "siteConfig", "carousel"));
                if (carouselDoc.exists()) {
                    const data = carouselDoc.data();
                    if (data.title) document.getElementById('metodoTitle').textContent = data.title;
                    if (data.desc) document.getElementById('metodoDesc').textContent = data.desc;
                    
                    if (data.items && data.items.length > 0) {
                        const track = document.getElementById('carouselTrack');
                        const dotsContainer = document.getElementById('dotsContainer');
                        track.innerHTML = '';
                        dotsContainer.innerHTML = '';

                        data.items.forEach((item, index) => {
                            const slide = document.createElement('div');
                            slide.className = 'min-w-full h-[450px] sm:h-[500px] flex items-center justify-center';
                            slide.innerHTML = `<img src="${item.image}" alt="Método ${index + 1}" class="max-h-full max-w-full object-contain">`;
                            track.appendChild(slide);

                            const dot = document.createElement('button');
                            dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === 0 ? 'bg-amber-400 w-6' : 'bg-gray-700'}`;
                            dot.onclick = () => { goToSlide(index); resetTimer(); };
                            dotsContainer.appendChild(dot);
                        });
                    }
                }

                // 2. Carregar Bio / Quem Sou Eu
                const bioDoc = await getDoc(doc(db, "siteConfig", "bio"));
                if (bioDoc.exists()) {
                    const bio = bioDoc.data();
                    if (bio.p1) document.getElementById('bioP1').textContent = bio.p1;
                    if (bio.p2) document.getElementById('bioP2').textContent = bio.p2;
                }
            } catch (err) {
                console.error("Erro ao carregar dados do Firebase:", err);
            }
        });
    </script>
