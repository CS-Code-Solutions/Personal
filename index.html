<!-- Script de Gestão do Painel com LocalStorage -->
    <script>
        // Navegação por Abas
        function switchTab(tabName) {
            ['depoimentos', 'carrossel', 'conteudo'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tabBtn-${t}`).className = "py-4 px-4 font-semibold text-sm border-b-2 border-transparent text-gray-400 hover:text-white transition whitespace-nowrap cursor-pointer";
            });
            document.getElementById(`section-${tabName}`).classList.remove('hidden');
            document.getElementById(`tabBtn-${tabName}`).className = "py-4 px-4 font-bold text-sm border-b-2 border-amber-400 text-amber-400 transition whitespace-nowrap cursor-pointer";
        }

        // Adicionar nova linha dinâmica para imagens
        function addCarouselRow() {
            const container = document.getElementById('batchCarouselRows');
            const rowDiv = document.createElement('div');
            rowDiv.className = "bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-4 relative batch-row";
            rowDiv.innerHTML = `
                <button type="button" onclick="this.closest('.batch-row').remove()" class="absolute top-4 right-4 text-rose-400 hover:text-rose-300 text-xs font-bold cursor-pointer">Remover</button>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Selecionar Imagem (JPG/PNG)</label>
                        <input type="file" accept="image/*" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2 text-white text-sm file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-gray-950 hover:file:bg-amber-600 row-file">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Tempo de Exibição (Segundos)</label>
                        <input type="number" value="6" min="2" max="30" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-500 row-time">
                    </div>
                </div>
            `;
            container.appendChild(rowDiv);
        }

        // Processar e guardar carrossel no LocalStorage
        function handleAddCarouselBatch(e) {
            e.preventDefault();
            const mainTitle = document.getElementById('carouselMainTitle').value;
            const mainDesc = document.getElementById('carouselMainDesc').value;
            const rows = document.querySelectorAll('.batch-row');
            
            // Recuperar itens existentes ou iniciar array
            let carouselItems = JSON.parse(localStorage.getItem('team_vasconcelos_carousel') || '[]');
            let processedCount = 0;

            rows.forEach(row => {
                const fileInput = row.querySelector('.row-file');
                const time = row.querySelector('.row-time').value;

                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();

                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 1000;
                            let width = img.width;
                            let height = img.height;

                            if (width > MAX_WIDTH) {
                                height = Math.round((height * MAX_WIDTH) / width);
                                width = MAX_WIDTH;
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

                            carouselItems.push({
                                image: dataUrl,
                                time: parseInt(time)
                            });

                            processedCount++;

                            if (processedCount === rows.length) {
                                // Guardar definições gerais e carrossel
                                localStorage.setItem('team_vasconcelos_carousel_title', mainTitle);
                                localStorage.setItem('team_vasconcelos_carousel_desc', mainDesc);
                                localStorage.setItem('team_vasconcelos_carousel', JSON.stringify(carouselItems));

                                alert('Imagens adicionadas e guardadas com sucesso no site!');
                                location.reload();
                            }
                        }
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        // Guardar Conteúdo do Site (Quem Sou Eu) no LocalStorage
        function handleSaveContent(event) {
            event.preventDefault();
            const p1 = event.target.querySelector('textarea:nth-of-type(1)').value;
            const p2 = event.target.querySelector('textarea:nth-of-type(2)').value;
            const fisiculturismo = event.target.querySelector('input:nth-of-type(1)').value;
            const peso = event.target.querySelector('input:nth-of-type(2)').value;
            const citacao = event.target.querySelector('textarea:nth-of-type(3)').value;

            const siteContent = { p1, p2, fisiculturismo, peso, citacao };
            localStorage.setItem('team_vasconcelos_content', JSON.stringify(siteContent));

            alert('Conteúdo da secção "Quem Sou Eu" guardado e atualizado no site com sucesso!');
        }
    </script>
