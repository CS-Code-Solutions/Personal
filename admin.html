<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Team Vasconcelos</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Montserrat', sans-serif; } </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header do Painel -->
    <header class="bg-gray-950 border-b border-gray-800 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-10 h-10 object-contain">
                <div>
                    <h1 class="font-bold text-lg text-white">Painel Administrativo</h1>
                    <span class="text-xs text-amber-400">Team Vasconcelos</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="index.html" target="_blank" class="text-sm bg-gray-900 hover:bg-gray-800 border border-gray-700 text-gray-300 px-4 py-2 rounded-xl transition">Ver Site Principal</a>
            </div>
        </div>
    </header>

    <!-- Navegação por Abas -->
    <div class="bg-gray-950/50 border-b border-gray-800 px-6">
        <div class="max-w-7xl mx-auto flex gap-4 overflow-x-auto">
            <button onclick="switchTab('depoimentos')" id="tabBtn-depoimentos" class="py-4 px-4 font-bold text-sm border-b-2 border-amber-400 text-amber-400 transition whitespace-nowrap cursor-pointer">Depoimentos</button>
            <button onclick="switchTab('carrossel')" id="tabBtn-carrossel" class="py-4 px-4 font-semibold text-sm border-b-2 border-transparent text-gray-400 hover:text-white transition whitespace-nowrap cursor-pointer">Gestão de Carrossel</button>
            <button onclick="switchTab('conteudo')" id="tabBtn-conteudo" class="py-4 px-4 font-semibold text-sm border-b-2 border-transparent text-gray-400 hover:text-white transition whitespace-nowrap cursor-pointer">Conteúdo do Site (Quem Sou Eu)</button>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto w-full px-6 py-10 flex-grow">

        <!-- ABA 1: DEPOIMENTOS -->
        <section id="section-depoimentos" class="space-y-8">
            <div class="bg-gray-950 border border-gray-800 rounded-3xl p-6 sm:p-8">
                <h3 class="text-xl font-bold text-white mb-2">Relatos e Depoimentos</h3>
                <p class="text-sm text-gray-400 mb-6">Gestão de relatos enviados pelos alunos via Firebase.</p>
                <div id="pendingList" class="space-y-4">
                    <!-- Dinâmico via Firebase -->
                </div>
            </div>
        </section>

        <!-- ABA 2: GESTÃO DE CARROSSEL -->
        <section id="section-carrossel" class="hidden space-y-8">
            <div class="bg-gray-950 border border-gray-800 rounded-3xl p-6 sm:p-8">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-white mb-1">Adicionar Imagens ao Carrossel</h3>
                        <p class="text-sm text-gray-400">O sistema compacta e envia diretamente para o Firebase Firestore.</p>
                    </div>
                    <button type="button" onclick="addCarouselRow()" class="bg-amber-500/20 hover:bg-amber-500 text-amber-300 hover:text-gray-950 font-bold px-4 py-2.5 rounded-xl text-xs transition border border-amber-500/30 cursor-pointer">+ Nova Imagem</button>
                </div>
                
                <form onsubmit="handleSaveCarouselData(event)" class="space-y-6">
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-4">
                        <span class="text-xs uppercase font-bold text-amber-400 block tracking-wider">Definições Gerais da Secção</span>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Título do Bloco / Secção</label>
                                <input type="text" id="carouselMainTitle" value="Conheça o Método Transformação de Elite" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 mb-1">Descrição Geral (Subtítulo)</label>
                                <input type="text" id="carouselMainDesc" value="Acompanhe as imagens abaixo para entender como funciona o nosso método de acompanhamento." required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-500">
                            </div>
                        </div>
                    </div>

                    <div id="batchCarouselRows" class="space-y-4">
                        <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-4 relative batch-row">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Selecionar Imagem (JPG/PNG)</label>
                                    <input type="file" accept="image/*" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2 text-white text-sm row-file">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Tempo de Exibição (Segundos)</label>
                                    <input type="number" value="6" min="2" max="30" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-white text-sm row-time">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold px-8 py-3.5 rounded-xl transition shadow-xl text-sm cursor-pointer">Guardar Alterações no Firebase</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ABA 3: CONTEÚDO DO SITE -->
        <section id="section-conteudo" class="hidden space-y-8">
            <div class="bg-gray-950 border border-gray-800 rounded-3xl p-6 sm:p-8">
                <h3 class="text-xl font-bold text-white mb-2">Edição da Secção "Quem Sou Eu"</h3>
                <form onsubmit="handleSaveContent(event)" class="space-y-6">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Parágrafo 1</label>
                        <textarea id="contentP1" rows="3" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white text-sm">A minha história começou aos 31 anos...</textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Parágrafo 2</label>
                        <textarea id="contentP2" rows="3" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white text-sm">Com muita persistência...</textarea>
                    </div>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold px-8 py-3.5 rounded-xl transition text-sm cursor-pointer">Guardar Conteúdo</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Script Firebase e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDsoyXz4x2BGXHmm-iPb56fn6K07AXOgSY",
            authDomain: "diegopersonal-9be2f.firebaseapp.com",
            projectId: "diegopersonal-9be2f",
            storageBucket: "diegopersonal-9be2f.firebasestorage.app",
            messagingSenderId: "263464241505",
            appId: "1:263464241505:web:a8eabb265936626f905d20"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchTab = function(tabName) {
            ['depoimentos', 'carrossel', 'conteudo'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tabBtn-${t}`).className = "py-4 px-4 font-semibold text-sm border-b-2 border-transparent text-gray-400 hover:text-white transition whitespace-nowrap cursor-pointer";
            });
            document.getElementById(`section-${tabName}`).classList.remove('hidden');
            document.getElementById(`tabBtn-${tabName}`).className = "py-4 px-4 font-bold text-sm border-b-2 border-amber-400 text-amber-400 transition whitespace-nowrap cursor-pointer";
        }

        window.addCarouselRow = function() {
            const container = document.getElementById('batchCarouselRows');
            const rowDiv = document.createElement('div');
            rowDiv.className = "bg-gray-900 border border-gray-800 p-4 rounded-2xl space-y-4 relative batch-row";
            rowDiv.innerHTML = `
                <button type="button" onclick="this.closest('.batch-row').remove()" class="absolute top-4 right-4 text-rose-400 text-xs font-bold cursor-pointer">Remover</button>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Selecionar Imagem</label>
                        <input type="file" accept="image/*" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2 text-white text-sm row-file">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-amber-400 mb-1">Tempo (Segundos)</label>
                        <input type="number" value="6" min="2" max="30" required class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-white text-sm row-time">
                    </div>
                </div>
            `;
            container.appendChild(rowDiv);
        }

        window.handleSaveCarouselData = async function(e) {
            e.preventDefault();
            const mainTitle = document.getElementById('carouselMainTitle').value;
            const mainDesc = document.getElementById('carouselMainDesc').value;
            const rows = document.querySelectorAll('.batch-row');
            let items = [];

            for (let row of rows) {
                const fileInput = row.querySelector('.row-file');
                const time = row.querySelector('.row-time').value;
                if (fileInput.files && fileInput.files[0]) {
                    const base64 = await toBase64(fileInput.files[0]);
                    items.push({ image: base64, time: parseInt(time) });
                }
            }

            try {
                await setDoc(doc(db, "siteConfig", "carousel"), { title: mainTitle, desc: mainDesc, items });
                alert('Carrossel guardado com sucesso no Firebase!');
            } catch (error) {
                alert('Erro ao guardar no Firebase: ' + error.message);
            }
        }

        window.handleSaveContent = async function(e) {
            e.preventDefault();
            const p1 = document.getElementById('contentP1').value;
            const p2 = document.getElementById('contentP2').value;

            try {
                await setDoc(doc(db, "siteConfig", "bio"), { p1, p2 });
                alert('Conteúdo guardado com sucesso no Firebase!');
            } catch (error) {
                alert('Erro ao guardar: ' + error.message);
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const img = new Image();
                    img.src = reader.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
